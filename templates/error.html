{% extends "base.html" %}

{% block title %}
Generation Error
{% endblock %}


{% block content %}

<section class="error-card">

    <span class="badge">
        GENERATION ERROR
    </span>

    <h1>
        Comic generation failed
    </h1>

    <p class="error-message">
        {{ error }}
    </p>

    <div class="actions">

        <a
            href="/"
            class="primary-button"
        >
            Back to ComicCraft
        </a>

    </div>

</section>

{% endblock %}
